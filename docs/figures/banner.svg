<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Compile Yourself. A one-instruction subleq machine: mem[a] -= mem[b], jump to c if the result is negative. Tier 1: four machine programs, echo, reverse, bigmul and hanoi. Tier 2: a v1 compiler in Python, tier2/v1c.py. Tier 3: the compiler written in v1, which reproduces itself, C1 = C2 = C3 on the official VM. Team Claude laggye, Compilers track, Synergy '26 Low Level Hackathon, IIIT Bangalore.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#14202c"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1e0"/><stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" fill="url(#bg)"/>
  <g font-family="Consolas, 'Courier New', monospace" fill="#4fd1e0" opacity="0.08" font-size="18">
    <text x="640" y="44">1048575 6 3  7 8 -1  -65 -1 0</text>
    <text x="640" y="120">Z y · x Z · Z Z   M1 Z L   x Z L</text>
  </g>
  <text x="60" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#e8f1f8">Compile Yourself</text>
  <rect x="60" y="104" width="400" height="5" rx="2" fill="url(#ac)"/>
  <text x="60" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#b8c7d4">A machine with one instruction (subleq):</text>
  <text x="472" y="148" font-family="Consolas, 'Courier New', monospace" font-size="21" fill="#e8f1f8">mem[a] -= mem[b]; if &lt; 0 goto c</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(60,180)">
      <rect width="350" height="124" rx="12" fill="#0f1822" stroke="#2a3b4c"/>
      <text x="20" y="34" font-size="20" font-weight="700" fill="#f5a524">Tier 1</text>
      <text x="20" y="66" font-size="18" fill="#e8f1f8">Four machine programs</text>
      <text x="20" y="96" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#b8c7d4">echo · reverse · bigmul · hanoi</text>
    </g>
    <g transform="translate(425,180)">
      <rect width="350" height="124" rx="12" fill="#0f1822" stroke="#2a3b4c"/>
      <text x="20" y="34" font-size="20" font-weight="700" fill="#4fd1e0">Tier 2</text>
      <text x="20" y="66" font-size="18" fill="#e8f1f8">v1 compiler in Python</text>
      <text x="20" y="96" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#b8c7d4">tier2/v1c.py → machine words</text>
    </g>
    <g transform="translate(790,180)">
      <rect width="350" height="124" rx="12" fill="#0f1822" stroke="#2a3b4c"/>
      <text x="20" y="34" font-size="20" font-weight="700" fill="#1baf7a">Tier 3</text>
      <text x="20" y="66" font-size="18" fill="#e8f1f8">The compiler in v1 rebuilds itself</text>
      <text x="20" y="96" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#b8c7d4">C1 = C2 = C3 on the official VM</text>
    </g>
  </g>
  <text x="60" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#7f93a5">Team Claude laggye · Compilers track (COMP01) · Synergy '26 Low Level Hackathon · IIIT Bangalore</text>
</svg>
